[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fftkv-vllm"
version = "0.1.0"
description = "Sequence-axis FFT KV cache codec as a vLLM attention backend plugin"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
fftkv = "fftkv_vllm:register"

[tool.setuptools]
packages = ["fftkv_vllm"]
py-modules = ["custom_layers"]
