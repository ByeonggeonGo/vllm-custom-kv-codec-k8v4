[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kvcodec-vllm"
version = "0.2.0"
description = "Custom KV cache codecs (int4, sequence-axis FFT) as a vLLM attention backend plugin"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
kvcodec = "kvcodec:register"

[tool.setuptools]
packages = ["kvcodec"]
py-modules = ["custom_layers"]
